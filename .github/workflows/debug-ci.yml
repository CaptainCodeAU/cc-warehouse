# TEMPORARY. Manually-triggered gate run for diagnosing the Linux-only test
# failures found while releasing 0.1.2 (2026-09-06): 22 tests fail on GitHub's
# ubuntu-latest runner that pass on macOS and in a matched local Linux
# container. `release.yml` only runs on a version tag, which is too expensive
# to push repeatedly while debugging, so this gives the same gate a cheap,
# tag-free trigger. Delete this file once that investigation closes.
name: debug-ci

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: rerun the one failing test with debug prints
        run: uv run pytest -q -s tests/test_build_incremental.py::test_a_mirror_failure_is_reported_as_an_error_not_built -v
