[project]
name = "cc-warehouse"
version = "0.1.0"
description = "Content-addressed, immutable warehouse for AI conversation sessions, projected into uniform markdown/HTML files."
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "CaptainCodeAU" }]
dependencies = []

[project.scripts]
ccw = "cc_warehouse.cli:main"
cc-warehouse = "cc_warehouse.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_warehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
