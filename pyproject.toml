[project]
name = "cc-warehouse"
version = "0.1.0"
description = "Content-addressed, immutable warehouse for AI conversation sessions, projected into uniform markdown/HTML files."
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "CaptainCodeAU" }]
dependencies = []

[project.scripts]
ccw = "cc_warehouse.cli:main"
cc-warehouse = "cc_warehouse.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1", "ruff>=0.5"]

# ADVISORY, not enforced by uv. Read only by the operator's shell functions
# (uv_tool_install_current_project / uv_tool_reinstall_current_project), which
# default to `--editable` without it. On any other machine this key is inert.
#
# `ccw hook` runs system-wide at every session end. An editable install makes
# ~/.local/bin/ccw a live view of src/, so a half-finished edit becomes the
# capture path for every session that ends. The requirement belongs to the
# project, not to whoever last typed a command. `ccw doctor` reports the mode it
# is ACTUALLY running under, because a pin is a request and not a proof.
[tool.uv-tool]
install-mode = "frozen"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_warehouse"]

# The sdist ships everything git does not ignore, and "git" there means THIS
# file's .gitignore - hatchling never reads a global one. MEMORY/ was ignored
# only by the operator's ~/.gitignore_global, so four PRD files rode into
# `uv build` output, two of them naming the account the repo is scrubbed of.
# Measured 2026-08-09: the repo had 0 occurrences of the username and the sdist
# had 2. A build artifact is a separate publication surface from the repo, and
# a machine-local ignore file cannot protect it. Belt and braces: MEMORY/ is now
# in .gitignore too, but this list is what the BUILD honours.
[tool.hatch.build.targets.sdist]
exclude = ["MEMORY", "Plans", "temp", ".claude", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["tests"]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["cc_warehouse", "conftest"]
