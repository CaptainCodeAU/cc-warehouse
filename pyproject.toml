[project]
name = "cc-warehouse"
version = "0.1.2"
description = "Content-addressed, immutable warehouse for AI conversation sessions, projected into uniform markdown/HTML files."
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "CaptainCodeAU" }]
dependencies = []
keywords = ["claude", "claude-code", "transcripts", "archive", "markdown", "sessions"]
# NO "License ::" classifier here, deliberately. PEP 639 says a distribution
# carrying `License-Expression` must not also carry one, and PyPI rejects the
# combination. The SPDX id in `license` above is the whole license statement.
# PolyForm-Noncommercial-1.0.0 is a valid SPDX identifier but is NOT OSI
# approved, so "License :: OSI Approved :: ..." would be false as well as
# duplicated. The version list mirrors requires-python; the suite is currently
# exercised on 3.14 only.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/CaptainCodeAU/cc-warehouse"
Repository = "https://github.com/CaptainCodeAU/cc-warehouse"
Changelog = "https://github.com/CaptainCodeAU/cc-warehouse/blob/master/CHANGELOG.md"

[project.scripts]
ccw = "cc_warehouse.cli:main"
cc-warehouse = "cc_warehouse.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1", "ruff>=0.5"]

# ADVISORY, not enforced by uv. Read only by the operator's shell functions
# (uv_tool_install_current_project / uv_tool_reinstall_current_project), which
# default to `--editable` without it. On any other machine this key is inert.
#
# `ccw hook` runs system-wide at every session end. An editable install makes
# ~/.local/bin/ccw a live view of src/, so a half-finished edit becomes the
# capture path for every session that ends. The requirement belongs to the
# project, not to whoever last typed a command. `ccw doctor` reports the mode it
# is ACTUALLY running under, because a pin is a request and not a proof.
[tool.uv-tool]
install-mode = "frozen"

# Pinned resolution cutoff. uv stamps this into uv.lock as `[options] exclude-newer`,
# so an unpinned project inherits whatever cutoff the ambient environment happens to
# carry and the committed lock churns whenever that value moves.
#
# THIS LIVES HERE RATHER THAN IN .envrc BECAUSE uv READS IT ITSELF. A .envrc pin needs
# direnv, and direnv binds to the shell prompt, so it never fires for cron, CI, git
# hooks or an agent's tool shell: exactly the contexts where nobody is watching. A
# pyproject pin has no such hole and needs no machine setup to work on a fresh clone.
#
# Precedence measured on uv 0.12.1, 2026-08-10, each step corroborated by the `idna`
# version actually resolved rather than by the string uv records:
#
#   --exclude-newer CLI      2023-06-01 -> idna 3.4     wins over everything
#   UV_EXCLUDE_NEWER env     2026-08-07 -> idna 3.18    beats both config files
#   [tool.uv] here           2023-06-01 -> idna 3.4     beats user-level uv.toml
#   ~/.config/uv/uv.toml     2021-01-01 -> idna 2.10    lowest, applies if nothing else
#
# So the one thing that still outranks this file is an exported UV_EXCLUDE_NEWER. That
# is a known and accepted limit: a machine whose shell exports a rolling cutoff will
# override this pin and re-stamp the lock. Nothing readable from inside the project can
# prevent that, which is why it is written down here instead of being guarded against.
#
# BUMPING: change the date in the same commit as any dependency change and run
# `uv lock` so the recorded cutoff matches. A pin never advances on its own, which is
# stricter than a rolling window and is the point; left stale for a long time it also
# means `uv add` resolves against a stale index.
[tool.uv]
exclude-newer = "2026-08-07T00:00:00Z"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_warehouse"]

# The sdist ships everything git does not ignore, and "git" there means THIS
# file's .gitignore - hatchling never reads a global one. MEMORY/ was ignored
# only by the operator's ~/.gitignore_global, so four PRD files rode into
# `uv build` output, two of them naming the account the repo is scrubbed of.
# Measured 2026-08-09: the repo had 0 occurrences of the username and the sdist
# had 2. A build artifact is a separate publication surface from the repo, and
# a machine-local ignore file cannot protect it. Belt and braces: MEMORY/ is now
# in .gitignore too, but this list is what the BUILD honours.
[tool.hatch.build.targets.sdist]
# `plugins` and `.claude-plugin` are the Claude Code capture plugin, which lives
# here so it cannot drift from the CLI it calls. They are excluded from the sdist
# on purpose: `pip install cc-warehouse` does not install a Claude Code plugin, so
# shipping them would put files in the tarball that nothing there can use.
exclude = ["MEMORY", "Plans", "temp", ".claude", ".github", "plugins", ".claude-plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["tests"]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"
# The capture plugin is NOT linted against this project's target, because it does
# not run on this project's interpreter. `hooks.json` invokes it as
# `python3 <path>`, i.e. whatever the SYSTEM provides, which on Ubuntu 22.04 is
# 3.10. Measured: ruff at py312 asks for `datetime.UTC`, which does not exist
# before 3.11 (`hasattr(datetime, "UTC")` is False on 3.10, while
# `timezone.utc` is True on both). Taking that autofix would have put an
# AttributeError in a SessionEnd hook, on the machines least likely to notice,
# in the one file whose entire purpose is to fail loudly rather than silently.
# The plugin targets "any python3" and is kept portable by hand.
exclude = ["plugins"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["cc_warehouse", "conftest"]
